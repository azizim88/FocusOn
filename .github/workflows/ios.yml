name: iOS build
# Controleert dat de app compileert (zonder code-signing). Een installeerbare .ipa vereist Apple-certificaten.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Genereer Xcode-project
        working-directory: ios
        run: xcodegen
      - name: Compileer
        working-directory: ios
        run: |
          xcodebuild -project FocusOn.xcodeproj -scheme FocusOn \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
