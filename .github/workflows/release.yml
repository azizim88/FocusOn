name: Release
# Start met een tag, bijv.:  git tag v0.1.0 && git push origin v0.1.0
# (of in GitHub: Releases > Draft a new release > nieuwe tag v0.1.0 > Publish)
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Bouw APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Verzamel bestanden
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/FocusOn-${GITHUB_REF_NAME}.apk"
          (cd prototype && zip -r "../dist/FocusOn-prototype-${GITHUB_REF_NAME}.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
